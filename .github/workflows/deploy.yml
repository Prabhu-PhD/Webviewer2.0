name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check web/app.js && node --check web/adapters.js && node --check web/scroll.js && node --check web/draw.js && node --check scripts/serve.mjs && node --check scripts/stamp-version.mjs

      - name: Lint
        run: npx --yes @biomejs/biome@1.9.4 lint --diagnostic-level=error web/ scripts/ test/

      - name: Unit tests
        run: node --test "test/**/*.test.js"

      - name: Stamp version
        run: node scripts/stamp-version.mjs

      - name: Prepare build directory
        run: |
          mkdir build
          cp -r web/* build/
          cp *.xml build/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
